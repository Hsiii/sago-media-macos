name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: scripts/build-app
        env:
          SAGO_DROP_CODESIGN_IDENTITY: "-"
      - run: codesign --verify --deep --strict ".build/Sago Drop.app"
      - run: plutil -lint ".build/Sago Drop.app/Contents/Info.plist"
